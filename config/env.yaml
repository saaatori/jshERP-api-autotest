# 管伊佳ERP 接口自动化基础配置(非敏感项)
# 敏感项(口令)放 config/env.local.yaml,该文件不入 Git

base_url: http://localhost:9999/jshERP-boot
timeout: 15

# DEF-EXP-06:同用户+同模块+同IP 同一秒内第二次操作会被强制注销(响应 loginOut),
# 实测 1100ms 间隔仍不安全,统一限速 2.0s
request_min_interval: 2.0

admin:
  login_name: jsh
  password: ""            # 本地口令在 env.local.yaml 覆盖

db:
  host: auto-wsl          # WSL2 IP 重启后变化;auto-wsl 自动解析,也可写死 IP
  port: 3306
  user: root
  password: ""            # 本地口令在 env.local.yaml 覆盖
  database: jsh_erp

# 每轮执行前校验的开关快照(需求分析 8.1/附录C)
switch_expect:
  checkcode_flag: "0"     # 验证码关闭(自动化环境)
  minus_stock_flag: "1"   # 允许负库存
